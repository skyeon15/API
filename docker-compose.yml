services:
  # DB는 별도 컨테이너(zemssj, API_DB_HOST=10.0.9.1)로 이관됨.
  # 앱은 IP로 직접 연결하므로 compose 내 db 서비스는 제거.

  # 개발용 Redis (Cache/Session)
  redis:
    image: redis:7-alpine
    container_name: pds-redis-dev
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - pds-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pds-network

  # 내 모노레포 코드 (API + Web)
  # 실행: ./scripts/compose-doppler.sh up
  # (스크립트가 Doppler에서 .env.runtime을 생성 후 compose에 주입.
  #  Doppler 대시보드에서 키 추가/삭제 시 이 파일 무수정으로 자동 반영됨.)
  app:
    image: node:24
    container_name: pds-monorepo-dev
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env.runtime
    # package.json의 dev 스크립트는 호스트 실행용으로 doppler run prefix가 붙어 있음.
    # 컨테이너 내부에서는 doppler CLI가 없고 env가 이미 주입되었으므로 turbo를 직접 호출.
    command: ["npx", "turbo", "dev"]
    ports:
      - "10150:10150" # Web
      - "10151:10151" # API
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pds-network

networks:
  pds-network:
    driver: bridge
    # subnet/gateway 고정: 앱은 외부 DB(zemssj, 호스트 5432 퍼블리시)에
    # 네트워크 게이트웨이를 통해 접속한다(API_DB_HOST=10.0.9.1).
    # 고정하지 않으면 down/up 시 subnet이 바뀌어 게이트웨이 IP가 달라져 DB 연결이 끊긴다.
    ipam:
      config:
        - subnet: 10.0.9.0/24
          gateway: 10.0.9.1

volumes:
  pds-redis-data:
